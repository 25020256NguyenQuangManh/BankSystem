name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Tests and Check Code Coverage
        run: mvn -B clean verify

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report-${{ matrix.os }}
          path: target/site/jacoco/
          retention-days: 5

      - name: Build with Maven (Package)
        run: mvn -B package -DskipTests

      - name: Upload Executable Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BankSystem-Executable-Jar-${{ matrix.os }}
          path: target/*.jar
          retention-days: 5